  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const STAR_RGB = hex(ESTRELLAS);

  const cv = document.getElementById("g"), ctx = cv.getContext("2d");
  document.documentElement.style.background = document.body.style.background = FONDO;
  let W, H, dpr, CW, CH, cols, rows, rnd;
  let tex = null, TS = 0;

  function seeded(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    CW = W < 700 ? 9 : 7; CH = Math.round(CW * 11 / 7);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / CW); rows = Math.ceil(H / CH);
    const R = seeded(11);
    rnd = new Float32Array(cols * rows);
    for (let i = 0; i < rnd.length; i++) rnd[i] = R();
    ctx.font = `${Math.round(CW * 12 / 7)}px Consolas, Menlo, "DejaVu Sans Mono", monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
  }

  // muestreo bilineal de la foto; (s,t) en 0..1. Devuelve r,g,b (0..1) en 'px'
  const px = [0, 0, 0];
  function sample(s, t) {
    if (s < 0 || t < 0 || s >= 1 || t >= 1) { px[0] = px[1] = px[2] = 0; return; }
    const x = s * (TS - 1), y = t * (TS - 1);
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
    const i00 = (y0 * TS + x0) * 4, i10 = i00 + 4, i01 = i00 + TS * 4, i11 = i01 + 4;
    const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
    for (let k = 0; k < 3; k++)
      px[k] = (tex[i00 + k] * w00 + tex[i10 + k] * w10 + tex[i01 + k] * w01 + tex[i11 + k] * w11) / 255;
  }


  // pasa una estrella por arriba y, FUGAZ_RETRASO segundos después, otra por abajo
  function fugaces(t) {
    const k = Math.floor((t - FUGAZ_PRIMERA) / FUGAZ_CADA);
    if (k < 0) return;
    const aspect = W / H, ca = Math.cos(FUGAZ_ANGULO), sa = Math.sin(FUGAZ_ANGULO);
    const nx = -sa, ny = ca;                         // perpendicular (hacia abajo en pantalla)
    const sMax = (aspect / 2 + 0.2) / Math.abs(ca), sMin = -sMax;
    const paso = (aspect / cols) * 0.9, N = Math.ceil(FUGAZ_COLA / paso);
    for (let w = 0; w < 2; w++) {
      const start = FUGAZ_PRIMERA + k * FUGAZ_CADA + w * FUGAZ_RETRASO;
      if (t < start) continue;
      const head = sMin + FUGAZ_VEL * (t - start);
      if (head - FUGAZ_COLA > sMax) continue;
      const off = (w === 0 ? -1 : 1) * (FUGAZ_DIST + (seeded(900 + k * 2 + w)() - 0.5) * 0.08);
      const seen = new Set();
      for (let i = 0; i < N; i++) {
        const s = head - i * paso;
        if (s < sMin || s > sMax) continue;
        const X = ca * s + nx * off, Y = sa * s + ny * off;
        const cx = Math.floor((X / aspect + 0.5) * cols), cy = Math.floor((Y + 0.5) * rows);
        if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) continue;
        const key = cy * cols + cx;
        if (seen.has(key)) continue;
        seen.add(key);
        const f = i / N;
        const ch = i === 0 ? "@" : RAMP[clamp(Math.floor((1 - f) * (RAMP.length - 1)), 1, RAMP.length - 1)];
        ctx.fillStyle = `rgba(${FUGAZ_RGB[0]},${FUGAZ_RGB[1]},${FUGAZ_RGB[2]},${Math.pow(1 - f, 1.4).toFixed(3)})`;
        ctx.fillText(ch, cx * CW + CW / 2, cy * CH + CH / 2);
      }
    }
  }

  const COS = Math.cos(TILT), SIN = Math.sin(TILT);
  // posiciones de las 4 sub-muestras dentro de cada celda (se promedian)
  const SUB = [[-0.25, -0.25], [0.25, -0.25], [-0.25, 0.25], [0.25, 0.25]];

  function draw(t) {
    ctx.fillStyle = FONDO;
    ctx.fillRect(0, 0, W, H);
    const aspect = W / H;
    const intro = smooth(t / 3);                  // la galaxia se enciende al abrir
    const ang = -SENTIDO * t * SPIN, ca = Math.cos(ang), sa = Math.sin(ang);
    const dx = aspect / cols, dy = 1 / rows;

    for (let row = 0; row < rows; row++) {
      for (let c = 0; c < cols; c++) {
        const i = row * cols + c;
        let r = 0, g = 0, b = 0;

        for (let k = 0; k < 4; k++) {
          const X = ((c + 0.5) / cols - 0.5) * aspect + SUB[k][0] * dx;
          const Y = (row + 0.5) / rows - 0.5 + SUB[k][1] * dy;
          // plano de la galaxia: inclinar, aplastar, girar
          const u = (X * COS + Y * SIN) / ZOOM, v = (-X * SIN + Y * COS) / FLAT / ZOOM;
          const ur = u * ca - v * sa, vr = u * sa + v * ca;
          sample(ur + 0.5, vr + 0.5);
          // viñeta circular para que al girar no se vean los bordes de la foto
          const f = 1 - smooth((Math.hypot(u, v) - 0.40) / 0.10);
          r += px[0] * f; g += px[1] * f; b += px[2] * f;
        }
        r *= 0.25 * TINTE[0]; g *= 0.25 * TINTE[1]; b *= 0.25 * TINTE[2];

        const lum = clamp(0.299 * r + 0.587 * g + 0.114 * b, 0, 1);
        const heat = Math.pow(clamp(lum * GANANCIA * intro, 0, 1), GAMMA);
        let ch = null, col = null;

        if (heat > UMBRAL) {
          const idx = clamp(Math.floor(heat * (RAMP.length - 0.01)), 1, RAMP.length - 1);
          ch = RAMP[idx];
          // color de la foto: se normaliza para que sea vivo y se modula con la luz
          const m = Math.max(r, g, b, 1e-4);
          const mean = (r + g + b) / 3 / m;                 // 0..1 (1 = blanco)
          let nr = r / m, ng = g / m, nb = b / m;
          nr = mean + (nr - mean) * SATURACION; ng = mean + (ng - mean) * SATURACION; nb = mean + (nb - mean) * SATURACION;
          const l = (0.35 + 0.8 * heat) * BRILLO * 255;
          col = `rgb(${clamp(nr * l, 0, 255) | 0},${clamp(ng * l, 0, 255) | 0},${clamp(nb * l, 0, 255) | 0})`;
        } else {
          const n = rnd[i];
          if (n < STAR_DENSITY) {
            const bright = n < 0.0015 ? 2 : n < 0.006 ? 1 : 0;
            ch = bright === 2 ? "*" : bright === 1 ? "+" : ".";
            const tw = 0.7 + 0.3 * Math.sin(0.9 * t + n * 9000);
            const l = (bright ? 1 : 0.7) * tw;
            col = `rgb(${(STAR_RGB[0] * l) | 0},${(STAR_RGB[1] * l) | 0},${(STAR_RGB[2] * l) | 0})`;
          }
        }
        if (ch === null || ch === " ") continue;
        ctx.fillStyle = col;
        ctx.fillText(ch, c * CW + CW / 2, row * CH + CH / 2);
      }
    }
    fugaces(t);
  }

  // ---------- bucle ----------
  resize();
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  let last = 0, t = 0;
  addEventListener("resize", () => { resize(); if (still.matches && tex) draw(6); });

  function loop(ms) {
    requestAnimationFrame(loop);
    if (still.matches || ms - last < 1000 / FPS) return;
    const dt = last ? Math.min((ms - last) / 1000, 0.1) : 0;
    last = ms; t += dt;
    draw(t);
  }

  const img = new Image();
  img.onload = () => {
    TS = img.width;
    const oc = document.createElement("canvas"); oc.width = oc.height = TS;
    const octx = oc.getContext("2d", { willReadFrequently: true });
    octx.drawImage(img, 0, 0);
    tex = octx.getImageData(0, 0, TS, TS).data;
    if (still.matches) draw(6);
    requestAnimationFrame(loop);
  };
  img.src = TEX;
})();
