<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="Moroni Muñoz">
  <title>Galaxia ASCII</title>
  <style>
    :root {
      color-scheme: dark;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #02030a;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="g" aria-label="Galaxia espiral hecha con caracteres ASCII"></canvas>
  <script>
    (() => {
      // ---------- AJUSTES ----------
      const FPS = 30;
      const TILT = -22 * Math.PI / 180;   // inclinación de la galaxia en pantalla
      const FLAT = 0.42;                  // 1 = de frente, menor = más de canto
      const SPIN = 0.35;                  // velocidad de giro (rad/s), rígido
      const ZOOM = 1.7;                   // tamaño de la galaxia (mayor = más grande)
      const STAR_DENSITY = 0.03;
      const RAMP = " .,:;-=+*#%@";

      // ---------- COLORES (edita aquí) ----------
      const FONDO = "#02030a";            // color del espacio
      const ESTRELLAS = "#fff0e1";        // color de las estrellas de fondo
      const BRILLO = 1;                   // 1 = normal, mayor = colores más intensos
      const HALO = 0;                     // neblina azul de fondo (0 = apagada, prueba 0.5)

      // Degradado de la galaxia según la distancia al centro.
      // [distancia, color]  ->  0 = centro, 0.45 = borde. Puedes agregar o quitar filas.
      const COLORES = [
        [0.07, "#fff0be"],   // núcleo cálido
        [0.17, "#ff7d19"],   // naranja
        [0.30, "#ff2878"],   // brazos magenta
        [0.45, "#d71e96"],   // borde
      ];
      // -------------------------------------------

      const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
      const PAL = COLORES.map(([r, h]) => [r, hex(h)]);
      const STAR_RGB = hex(ESTRELLAS);

      const smooth = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };
      const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
      const mix = (a, b, k) => a + (b - a) * k;

      const cv = document.getElementById("g"), ctx = cv.getContext("2d");
      document.documentElement.style.background = document.body.style.background = FONDO;
      let W, H, dpr, CW, CH, cols, rows, rnd;

      function seeded(seed) {
        return () => {
          seed |= 0; seed = seed + 0x6D2B79F5 | 0;
          let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight;
        CW = W < 700 ? 9 : 7; CH = Math.round(CW * 11 / 7);
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.ceil(W / CW); rows = Math.ceil(H / CH);
        const R = seeded(11);
        rnd = new Float32Array(cols * rows);
        for (let i = 0; i < rnd.length; i++) rnd[i] = R();
        ctx.font = `${Math.round(CW * 12 / 7)}px Consolas, Menlo, "DejaVu Sans Mono", monospace`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
      }

      // color según distancia al centro, interpolando entre las filas de COLORES
      function tone(rho, heat) {
        let c = PAL[PAL.length - 1][1];
        if (rho <= PAL[0][0]) c = PAL[0][1];
        else for (let k = 1; k < PAL.length; k++) {
          if (rho < PAL[k][0]) {
            const [r0, c0] = PAL[k - 1], [r1, c1] = PAL[k], f = (rho - r0) / (r1 - r0);
            c = [mix(c0[0], c1[0], f), mix(c0[1], c1[1], f), mix(c0[2], c1[2], f)];
            break;
          }
        }
        const l = clamp(0.5 + 0.9 * heat, 0, 1.25) * BRILLO;
        return `rgb(${Math.min(255, c[0] * l) | 0},${Math.min(255, c[1] * l) | 0},${Math.min(255, c[2] * l) | 0})`;
      }

      const COS = Math.cos(TILT), SIN = Math.sin(TILT);

      function draw(t) {
        ctx.fillStyle = FONDO;
        ctx.fillRect(0, 0, W, H);
        const aspect = W / H;
        const intro = smooth(t / 3);        // la galaxia se enciende al abrir

        for (let row = 0; row < rows; row++) {
          for (let c = 0; c < cols; c++) {
            const i = row * cols + c;
            const X = ((c + 0.5) / cols - 0.5) * aspect;
            const Y = (row + 0.5) / rows - 0.5;

            // plano de la galaxia: rotar, aplastar, pasar a radio/ángulo
            const u = (X * COS + Y * SIN) / ZOOM, v = (-X * SIN + Y * COS) / FLAT / ZOOM;
            const rho = Math.hypot(u, v), phi = Math.atan2(v, u);

            // los brazos giran más rápido cerca del centro
            const a = phi - Math.log(rho / 0.04 + 1) * 1.9 + t * SPIN;
            const arm = 0.5 + 0.5 * Math.cos(2 * a);
            const dustA = 0.5 + 0.5 * Math.cos(2 * a + 1.1);

            const core = Math.exp(-rho / 0.045) * 1.5;
            const bulge = Math.exp(-((rho / 0.13) ** 2)) * 0.8;
            const edge = smooth((0.45 - rho) / 0.15);
            const clump = 0.75 + 0.25 * Math.sin(37 * a + 21 * rho + 0.4 * t) * Math.sin(13 * phi - 9 * rho);
            let disk = Math.exp(-rho / 0.28) * (0.15 + 0.85 * arm ** 2.2) * edge * clump * 1.8;
            const dust = (dustA ** 3) * smooth((rho - 0.08) / 0.1) * smooth((0.4 - rho) / 0.2);
            disk *= 1 - 0.55 * dust;

            // halo azul muy suave de fondo
            const haze = HALO * (0.5 + 0.5 * Math.sin(5 * X + 3 * Math.sin(4 * Y + 0.2 * t))) * Math.exp(-rho / 0.9);

            const heat = clamp((core + bulge + disk) * intro * 1.3, 0, 1.25);
            let ch = null, col = null;

            if (heat > 0.06) {
              const idx = clamp(Math.floor(heat * 9.5), 1, RAMP.length - 1);
              ch = RAMP[idx];
              col = tone(rho, heat);
            } else {
              const n = rnd[i];
              if (n < STAR_DENSITY) {
                const bright = n < 0.0015 ? 2 : n < 0.006 ? 1 : 0;
                ch = bright === 2 ? "*" : bright === 1 ? "+" : ".";
                const tw = 0.7 + 0.3 * Math.sin(0.9 * t + n * 9000);
                const l = (bright ? 1 : 0.7) * tw;
                col = `rgb(${(STAR_RGB[0] * l) | 0},${(STAR_RGB[1] * l) | 0},${(STAR_RGB[2] * l) | 0})`;
              } else if (haze > 0.05) {
                ch = haze > 0.08 ? ":" : ".";
                col = `rgb(${(40 + 260 * haze) | 0},${(50 + 300 * haze) | 0},${(110 + 600 * haze) | 0})`;
              }
            }
            if (ch === null || ch === " ") continue;
            ctx.fillStyle = col;
            ctx.fillText(ch, c * CW + CW / 2, row * CH + CH / 2);
          }
        }
      }

      // ---------- bucle ----------
      resize();
      const still = matchMedia("(prefers-reduced-motion: reduce)");
      let last = 0, t = 0;
      addEventListener("resize", () => { resize(); if (still.matches) draw(6); });
      if (still.matches) draw(6);

      function loop(ms) {
        requestAnimationFrame(loop);
        if (still.matches || ms - last < 1000 / FPS) return;
        const dt = last ? Math.min((ms - last) / 1000, 0.1) : 0;
        last = ms; t += dt;
        draw(t);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>

</html>
