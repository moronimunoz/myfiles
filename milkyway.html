<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universo ASCII</title>
<style>
  :root { color-scheme: dark; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { background: transparent; }
  #escenario { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #escenario canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #glow { filter: blur(9px); mix-blend-mode: screen; opacity: .85; }
  #velo { position: absolute; inset: 0; background: rgba(0,0,0,.25); }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 244px; max-width: 80vw; box-sizing: border-box;
    padding: calc(12px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px)) 16px 14px;
    overflow-y: auto; background: rgba(10,12,28,.86); backdrop-filter: blur(6px); border-left: 1px solid #2a2f4a;
    color: #cfd3e6; font: 12px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; z-index: 5;
    transition: transform .25s, visibility .25s; color-scheme: dark; }
  #panel.cerrado { transform: translateX(100%); visibility: hidden; }
  #panel button, #abrir { font: inherit; color: #cfd3e6; background: transparent; border: 1px solid #3a4060; border-radius: 6px; cursor: pointer; }
  #panel button:hover, #abrir:hover { background: #1b2040; }
  #abrir { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; padding: 6px 10px; background: rgba(10,12,28,.86); z-index: 4; }
  #panel .cab { display: flex; justify-content: space-between; align-items: center; font-weight: 500; font-size: 14px; }
  #panel .cab button { width: 28px; height: 28px; padding: 0; font-size: 16px; }
  #panel select { width: 100%; height: 32px; margin-top: 10px; padding: 0 8px; font: inherit; color: #e8ebff; background: #161a33; border: 1px solid #3a4060; border-radius: 6px; cursor: pointer; }
  #panel details { border-top: 1px solid #1f2440; margin-top: 10px; padding-top: 8px; }
  #panel summary { cursor: pointer; font-weight: 500; color: #8d93b5; margin-bottom: 6px; }
  #panel .fila { margin: 0 0 7px; }
  #panel .fila .top { display: flex; justify-content: space-between; color: #aab0cf; }
  #panel .fila .top b { font-weight: 400; color: #e8ebff; }
  #panel input[type=range] { width: 100%; margin: 3px 0 0; accent-color: #ff7d19; }
  #panel .seg { display: flex; gap: 6px; margin: 2px 0 4px; }
  #panel .seg button { flex: 1; height: 28px; }
  #panel .seg button.on { background: #22284a; border-color: #4a5280; color: #fff; }
  #panel .sw { display: grid; grid-template-columns: repeat(auto-fit, minmax(42px, 1fr)); gap: 4px; margin-bottom: 8px; text-align: center; font-size: 10.5px; color: #8d93b5; }
  #panel .sw input { width: 100%; height: 24px; padding: 0; border: 1px solid #3a4060; border-radius: 6px; background: none; cursor: pointer; }
  #panel .acc { display: flex; gap: 6px; margin-top: 14px; }
  #panel .acc button { flex: 1; height: 30px; }
  #panel .exp { width: 100%; height: 32px; margin-top: 6px; }
  #panel .nota { margin: 6px 0 0; font-size: 11px; color: #8d93b5; }
</style>
</head>
<body>
<div id="escenario" aria-hidden="true">
  <canvas id="g"></canvas>
  <canvas id="glow"></canvas>
  <div id="velo"></div>
</div>
<aside id="panel" aria-label="Controles"></aside>
<button id="abrir" aria-label="Mostrar controles" hidden>Controles</button>
<script id="motor">
(() => {
  const FPS = 30;
  const RAMP = " .,:;-=+*#%@";
  const TAU = Math.PI * 2;
  const smooth = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const mix = (a, b, k) => a + (b - a) * k;
  const mod = (a, n) => ((a % n) + n) % n;
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const redondo = v => Math.round(v * 100) / 100;

  function seeded(seed) {            // aleatorio fijo, para que las estrellas no cambien al redimensionar
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // <ESCENARIO>
  const cv = document.getElementById("g"), ctx = cv.getContext("2d");
  const gl = document.getElementById("glow"), gctx = gl.getContext("2d");
  const velo = document.getElementById("velo");
  // </ESCENARIO>

  const still = matchMedia("(prefers-reduced-motion: reduce)");
  let W, H, dpr, CW, CH, cols, rows;
  let desv = 0;                         // corrimiento hacia la izquierda cuando el panel está abierto
  const UNIVERSOS = {};
  const INICIAL = "milky";
  let U = null, clave = INICIAL, t = 0, alActivar = () => {};

  // <FUGACES>
  // estrellas fugaces al azar (líneas finas). Las usan Milky Way y Galaxy Webb.
  const FILAS_FUGACES = [
    ["FUGAZ_MIN", "Espera mínima", 1, 20, 1, 1, " s"],
    ["FUGAZ_MAX", "Espera máxima", 2, 30, 1, 1, " s"],
    ["FUGAZ_DOBLE", "Probabilidad de doble", 0, 1, 0.05, 100, "%"],
    ["FUGAZ_VEL", "Velocidad", 0.5, 4, 0.1, 1, ""],
    ["FUGAZ_COLA", "Largo", 0.05, 0.4, 0.01, 1, ""],
    ["FUGAZ_GROSOR", "Grosor", 0.5, 3, 0.1, 1, " px"],
  ];

  function crearFugaces(getCfg, getAngulo) {
    const FUGAZ_PRIMERA = 4;            // cuándo sale la primera (s)
    const FUGAZ_INVERSA = 0.15;         // probabilidad de que vaya de derecha a izquierda
    const FUGAZ_VARIACION = 8;          // grados al azar que se desvía del ángulo base
    const FUGAZ_DIST = 0.4;             // qué tan lejos del centro puede pasar (arriba o abajo, al azar)
    const lista = [];
    let proxima = FUGAZ_PRIMERA;
    const rr = (lo, hi) => lo + Math.random() * (hi - lo);

    function nueva(start) {
      const c = getCfg();
      lista.push({
        start,
        ang: getAngulo() + rr(-1, 1) * FUGAZ_VARIACION * Math.PI / 180,
        inv: Math.random() < FUGAZ_INVERSA,
        off: rr(-1, 1) * FUGAZ_DIST,
        vel: c.FUGAZ_VEL * rr(0.8, 1.25),
        cola: c.FUGAZ_COLA * rr(0.7, 1.3),
      });
    }

    return {
      reiniciar() { lista.length = 0; proxima = FUGAZ_PRIMERA; },
      dibujar(t) {
        if (still.matches) return;
        const c = getCfg();
        const mn = Math.min(c.FUGAZ_MIN, c.FUGAZ_MAX), mx = Math.max(c.FUGAZ_MIN, c.FUGAZ_MAX);
        if (proxima - t > mx) proxima = t + rr(mn, mx);   // si bajas la espera, se aplica enseguida
        if (t >= proxima) {
          nueva(t);
          if (Math.random() < c.FUGAZ_DOBLE) nueva(t + rr(0.3, 1.2));
          proxima = t + rr(mn, mx);
        }
        const aspect = W / H, [fr, fg, fb] = hex(c.FUGAZ_COLOR);
        ctx.lineWidth = c.FUGAZ_GROSOR; ctx.lineCap = "round";
        for (let n = lista.length - 1; n >= 0; n--) {
          const e = lista[n];
          if (t < e.start) continue;
          const ca = Math.cos(e.ang), sa = Math.sin(e.ang), nx = -sa, ny = ca;
          const sMax = (aspect / 2 + 0.2) / Math.abs(ca), dir = e.inv ? -1 : 1;
          const head = -dir * sMax + dir * e.vel * (t - e.start);
          const tail = head - dir * e.cola;
          if (dir * tail > sMax) { lista.splice(n, 1); continue; }   // ya salió de la pantalla
          const P = s => [((ca * s + nx * e.off) / aspect + 0.5) * W, ((sa * s + ny * e.off) + 0.5) * H];
          const [hx, hy] = P(head), [tx, ty] = P(tail);
          const g = ctx.createLinearGradient(tx, ty, hx, hy);
          g.addColorStop(0, `rgba(${fr},${fg},${fb},0)`);
          g.addColorStop(0.75, `rgba(${fr},${fg},${fb},0.5)`);
          g.addColorStop(1, "rgba(255,255,255,0.95)");
          ctx.strokeStyle = g;
          ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,0.9)";      // punto brillante en la cabeza
          ctx.beginPath(); ctx.arc(hx, hy, c.FUGAZ_GROSOR * 0.8, 0, Math.PI * 2); ctx.fill();
        }
      },
    };
  }
  // </FUGACES>

  // <UNI milky>
  UNIVERSOS.milky = (() => {
    const DEF = {
      SPIN: 0.35,                       // velocidad de giro (rad/s)
      SENTIDO: 1,                       // 1 = antihorario, -1 = horario
      ZOOM: 1.7,                        // tamaño de la galaxia
      TILT_DEG: -22,                    // inclinación en pantalla (grados)
      FLAT: 0.42,                       // 1 = de frente, menor = más de canto
      BRILLO: 1,                        // intensidad de los colores
      COLORES: ["#fff0be", "#ff7d19", "#ff2878", "#d71e96"],   // núcleo, naranja, brazos, borde
      NEBULOSA: 0.9,                    // manchas de color de fondo (0 = apagadas)
      STAR_DENSITY: 0.03,               // estrellas sueltas
      PUNTOS_DENSIDAD: 0.010,           // puntos de colores
      FUGAZ_MIN: 3,                     // espera mínima entre fugaces (s)
      FUGAZ_MAX: 12,                    // espera máxima (s)
      FUGAZ_DOBLE: 0.25,                // probabilidad de doble (0 a 1)
      FUGAZ_VEL: 1.9,                   // velocidad
      FUGAZ_COLA: 0.11,                 // largo de la línea
      FUGAZ_GROSOR: 1.1,                // grosor (px)
      FUGAZ_COLOR: "#d6ebff",           // color
    };
    const CFG = JSON.parse(JSON.stringify(DEF));
    const COM = {"SPIN": "velocidad de giro (rad/s)", "SENTIDO": "1 = antihorario, -1 = horario", "ZOOM": "tamaño de la galaxia", "TILT_DEG": "inclinación en pantalla (grados)", "FLAT": "1 = de frente, menor = más de canto", "BRILLO": "intensidad de los colores", "COLORES": "núcleo, naranja, brazos, borde", "NEBULOSA": "manchas de color de fondo (0 = apagadas)", "STAR_DENSITY": "estrellas sueltas", "PUNTOS_DENSIDAD": "puntos de colores", "FUGAZ_MIN": "espera mínima entre fugaces (s)", "FUGAZ_MAX": "espera máxima (s)", "FUGAZ_DOBLE": "probabilidad de doble (0 a 1)", "FUGAZ_VEL": "velocidad", "FUGAZ_COLA": "largo de la línea", "FUGAZ_GROSOR": "grosor (px)", "FUGAZ_COLOR": "color"};

    const FONDO = "#02030a", ESTRELLAS = "#fff0e1";
    const NEBULOSA_COLORES = ["#6e3cab", "#ab5a50"];   // violeta -> marrón rojizo
    const PUNTOS_COLORES = ["#7fb2ff", "#a5ccff", "#ffb066", "#ff8fb0", "#ffe27a", "#b68cff"];
    const COLOR_POS = [0.07, 0.17, 0.30, 0.45];       // distancia al centro de cada color del degradado
    const STAR_RGB = hex(ESTRELLAS), PUNTOS_RGB = PUNTOS_COLORES.map(hex), NEB_RGB = NEBULOSA_COLORES.map(hex);
    let PAL, rnd, rnd2, fase = 0;
    const fuga = crearFugaces(() => CFG, () => CFG.TILT_DEG * Math.PI / 180);

    function recolor() { PAL = CFG.COLORES.map((h, i) => [COLOR_POS[i], hex(h)]); }
    recolor();

    function tone(rho, heat) {
      let c = PAL[PAL.length - 1][1];
      if (rho <= PAL[0][0]) c = PAL[0][1];
      else for (let k = 1; k < PAL.length; k++) {
        if (rho < PAL[k][0]) {
          const [r0, c0] = PAL[k - 1], [r1, c1] = PAL[k], f = (rho - r0) / (r1 - r0);
          c = [mix(c0[0], c1[0], f), mix(c0[1], c1[1], f), mix(c0[2], c1[2], f)];
          break;
        }
      }
      const l = clamp(0.5 + 0.9 * heat, 0, 1.25) * CFG.BRILLO;
      return `rgb(${Math.min(255, c[0] * l) | 0},${Math.min(255, c[1] * l) | 0},${Math.min(255, c[2] * l) | 0})`;
    }

    function resize() {
      CW = W < 700 ? 9 : 7; CH = Math.round(CW * 11 / 7);
      cols = Math.ceil(W / CW); rows = Math.ceil(H / CH);
      const R = seeded(11), R2 = seeded(23);
      rnd = new Float32Array(cols * rows); rnd2 = new Float32Array(cols * rows);
      for (let i = 0; i < rnd.length; i++) rnd[i] = R();
      for (let i = 0; i < rnd2.length; i++) rnd2[i] = R2();
      ctx.font = `${Math.round(CW * 12 / 7)}px Consolas, Menlo, "DejaVu Sans Mono", monospace`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
    }

    function draw(t, dt) {
      fase += dt * CFG.SPIN * CFG.SENTIDO;
      ctx.fillStyle = FONDO;
      ctx.fillRect(0, 0, W, H);
      const aspect = W / H;
      const intro = smooth(t / 3);        // la galaxia se enciende al abrir
      const { ZOOM, FLAT, NEBULOSA, STAR_DENSITY, PUNTOS_DENSIDAD } = CFG;
      const rad = CFG.TILT_DEG * Math.PI / 180, COS = Math.cos(rad), SIN = Math.sin(rad);

      for (let row = 0; row < rows; row++) {
        for (let c = 0; c < cols; c++) {
          const i = row * cols + c;
          const X = ((c + 0.5) / cols - 0.5) * aspect + desv;
          const Y = (row + 0.5) / rows - 0.5;

          // plano de la galaxia: rotar, aplastar, pasar a radio/ángulo
          const u = (X * COS + Y * SIN) / ZOOM, v = (-X * SIN + Y * COS) / FLAT / ZOOM;
          const rho = Math.hypot(u, v), phi = Math.atan2(v, u);

          // giro rígido: la forma nunca cambia, solo rota
          const a = phi - Math.log(rho / 0.04 + 1) * 1.9 + fase;
          const arm = 0.5 + 0.5 * Math.cos(2 * a);
          const dustA = 0.5 + 0.5 * Math.cos(2 * a + 1.1);

          const core = Math.exp(-rho / 0.045) * 1.5;
          const bulge = Math.exp(-((rho / 0.13) ** 2)) * 0.8;
          const edge = smooth((0.45 - rho) / 0.15);
          const clump = 0.75 + 0.25 * Math.sin(37 * a + 21 * rho + 0.4 * t) * Math.sin(13 * phi - 9 * rho);
          let disk = Math.exp(-rho / 0.28) * (0.15 + 0.85 * arm ** 2.2) * edge * clump * 1.8;
          const dust = (dustA ** 3) * smooth((rho - 0.08) / 0.1) * smooth((0.4 - rho) / 0.2);
          disk *= 1 - 0.55 * dust;

          // nebulosa: manchas suaves de color, muy tenues
          const nf = Math.sin(2.3 * X + 1.4 * Math.sin(3.1 * Y + 1.0) + 0.03 * t) * Math.sin(1.9 * Y - 1.2 * X + 2.0);
          const neb = NEBULOSA * smooth((nf - 0.1) / 0.6);

          const heat = clamp((core + bulge + disk) * intro * 1.3, 0, 1.25);
          let ch = null, col = null;

          if (heat > 0.06) {
            const idx = clamp(Math.floor(heat * 9.5), 1, RAMP.length - 1);
            ch = RAMP[idx];
            col = tone(rho, heat);
          } else {
            const n = rnd[i];
            if (n < STAR_DENSITY) {
              const bright = n < 0.0015 ? 2 : n < 0.006 ? 1 : 0;
              ch = bright === 2 ? "*" : bright === 1 ? "+" : ".";
              const tw = 0.7 + 0.3 * Math.sin(0.9 * t + n * 9000);
              const l = (bright ? 1 : 0.7) * tw;
              col = `rgb(${(STAR_RGB[0] * l) | 0},${(STAR_RGB[1] * l) | 0},${(STAR_RGB[2] * l) | 0})`;
            } else if (rnd2[i] < PUNTOS_DENSIDAD) {
              // punto de color suelto (estrella azul, naranja, rosa...)
              const q = rnd2[i] / PUNTOS_DENSIDAD, rgb = PUNTOS_RGB[Math.floor(n * 7919) % PUNTOS_RGB.length];
              ch = q < 0.15 ? "*" : q < 0.45 ? "+" : ".";
              const l = 0.75 + 0.25 * Math.sin(0.7 * t + n * 5000);
              col = `rgb(${(rgb[0] * l) | 0},${(rgb[1] * l) | 0},${(rgb[2] * l) | 0})`;
            } else if (neb > 0 && rnd2[i] < neb * 0.5) {
              const m = 0.5 + 0.5 * Math.sin(1.7 * X - 2.1 * Y), l = 0.4 + 0.5 * neb;
              ch = rnd2[i] < neb * 0.12 ? ":" : ".";
              col = `rgb(${(mix(NEB_RGB[0][0], NEB_RGB[1][0], m) * l) | 0},${(mix(NEB_RGB[0][1], NEB_RGB[1][1], m) * l) | 0},${(mix(NEB_RGB[0][2], NEB_RGB[1][2], m) * l) | 0})`;
            }
          }
          if (ch === null || ch === " ") continue;
          ctx.fillStyle = col;
          ctx.fillText(ch, c * CW + CW / 2, row * CH + CH / 2);
        }
      }
      fuga.dibujar(t);
    }

    return {
      nombre: "Milky Way", archivo: "milkyway.js", fondo: FONDO, glow: false,
      DEF, CFG, COM, recolor,
      grupos: [
        ["Galaxia", [
          ["SPIN", "Giro", 0, 1.5, 0.01, 1, ""],
          ["ZOOM", "Zoom", 0.8, 3, 0.05, 1, ""],
          ["TILT_DEG", "Inclinación", -90, 90, 1, 1, "°"],
          ["FLAT", "Aplastamiento", 0.2, 1, 0.01, 1, ""],
        ], { sentido: [["Antihorario", 1], ["Horario", -1]] }],
        ["Colores", [
          ["BRILLO", "Brillo", 0.5, 1.5, 0.05, 1, ""],
        ], { colores: [["Núcleo", "COLORES", 0], ["Naranja", "COLORES", 1], ["Brazos", "COLORES", 2], ["Borde", "COLORES", 3], ["Fugaz", "FUGAZ_COLOR"]] }],
        ["Fondo", [
          ["NEBULOSA", "Nebulosa", 0, 2, 0.1, 1, ""],
          ["STAR_DENSITY", "Estrellas", 0, 0.08, 0.005, 100, "%"],
          ["PUNTOS_DENSIDAD", "Puntos de color", 0, 0.03, 0.001, 100, "%"],
        ]],
        ["Estrellas fugaces", FILAS_FUGACES],
      ],
      arrancar() { fase = 0; fuga.reiniciar(); },
      resize, draw,
      quieto() { fase = 6 * CFG.SPIN * CFG.SENTIDO; draw(6, 0); },
    };
  })();
  // </UNI milky>

  // <UNI webb>
  UNIVERSOS.webb = (() => {
    const DEF = {
      SPIN: 0.12,                       // velocidad de giro (rad/s)
      SENTIDO: 1,                       // 1 = horario, -1 = antihorario
      ZOOM: 1.05,                       // tamaño de la galaxia
      TILT_DEG: 0,                      // inclinación en pantalla (grados)
      FLAT: 1,                          // 1 = de frente, menor = más de canto
      BRILLO: 1,                        // brillo general
      SATURACION: 1.15,                 // 1 = color de la foto, mayor = más vivo
      GANANCIA: 1.9,                    // cuánta luz se convierte en caracteres densos
      GAMMA: 1.2,                       // menor = más caracteres en zonas oscuras
      UMBRAL: 0.07,                     // por debajo de esto no se dibuja nada
      TINTE: "#ffffff",                 // tiñe toda la imagen (blanco = sin cambio)
      ESTRELLAS: "#fff0e1",             // color de las estrellas sueltas
      STAR_DENSITY: 0.02,               // estrellas sueltas
      FUGAZ_MIN: 3,                     // espera mínima entre fugaces (s)
      FUGAZ_MAX: 12,                    // espera máxima (s)
      FUGAZ_DOBLE: 0.25,                // probabilidad de doble (0 a 1)
      FUGAZ_VEL: 1.9,                   // velocidad
      FUGAZ_COLA: 0.11,                 // largo de la línea
      FUGAZ_GROSOR: 1.1,                // grosor (px)
      FUGAZ_COLOR: "#d6ebff",           // color
      FUGAZ_ANG: -22,                   // ángulo de las fugaces (grados)
    };
    const CFG = JSON.parse(JSON.stringify(DEF));

          const i = row * cols + c;

          for (let k = 0; k < 4; k++) {
            const X = ((c + 0.5) / cols - 0.5) * aspect + SUB[k][0] * dx + desv;
            const Y = (row + 0.5) / rows - 0.5 + SUB[k][1] * dy;
            // plano de la galaxia: inclinar, aplastar, girar
            const u = (X * COS + Y * SIN) / ZOOM, v = (-X * SIN + Y * COS) / FLAT / ZOOM;
            const ur = u * ca - v * sa, vr = u * sa + v * ca;
            sample(ur + 0.5, vr + 0.5);
            // viñeta circular para que al girar no se vean los bordes de la foto
            const f = 1 - smooth((Math.hypot(u, v) - 0.40) / 0.10);
            r += px[0] * f; g += px[1] * f; b += px[2] * f;
          }
          r *= 0.25 * tn[0]; g *= 0.25 * tn[1]; b *= 0.25 * tn[2];

          const lum = clamp(0.299 * r + 0.587 * g + 0.114 * b, 0, 1);
          const heat = Math.pow(clamp(lum * GANANCIA * intro, 0, 1), GAMMA);
          let ch = null, col = null;

          if (heat > UMBRAL) {
            const idx = clamp(Math.floor(heat * (RAMP.length - 0.01)), 1, RAMP.length - 1);
            ch = RAMP[idx];
            // color de la foto: se normaliza para que sea vivo y se modula con la luz
            const m = Math.max(r, g, b, 1e-4);
            const mean = (r + g + b) / 3 / m;
            let nr = r / m, ng = g / m, nb = b / m;
            nr = mean + (nr - mean) * SATURACION; ng = mean + (ng - mean) * SATURACION; nb = mean + (nb - mean) * SATURACION;
            const l = (0.35 + 0.8 * heat) * BRILLO * 255;
            col = `rgb(${clamp(nr * l, 0, 255) | 0},${clamp(ng * l, 0, 255) | 0},${clamp(nb * l, 0, 255) | 0})`;
          } else {
            const n = rnd[i];
            if (n < STAR_DENSITY) {
              const bright = n < 0.0015 ? 2 : n < 0.006 ? 1 : 0;
              ch = bright === 2 ? "*" : bright === 1 ? "+" : ".";
              const tw = 0.7 + 0.3 * Math.sin(0.9 * t + n * 9000);
              const l = (bright ? 1 : 0.7) * tw;
              col = `rgb(${(STAR_RGB[0] * l) | 0},${(STAR_RGB[1] * l) | 0},${(STAR_RGB[2] * l) | 0})`;
            }
          }
          if (ch === null || ch === " ") continue;
          ctx.fillStyle = col;
          ctx.fillText(ch, c * CW + CW / 2, row * CH + CH / 2);
        }
      }
      fuga.dibujar(t);
    }

    return {
      nombre: "Galaxy Webb", archivo: "galaxywebb.js", fondo: FONDO, glow: false,
      DEF, CFG, COM,
      grupos: [
        ["Galaxia", [
          ["SPIN", "Giro", 0, 1, 0.01, 1, ""],
          ["ZOOM", "Zoom", 0.7, 2.5, 0.05, 1, ""],
          ["TILT_DEG", "Inclinación", -90, 90, 1, 1, "°"],
          ["FLAT", "Aplastamiento", 0.2, 1, 0.01, 1, ""],
        ], { sentido: [["Horario", 1], ["Antihorario", -1]] }],
        ["Imagen", [
          ["BRILLO", "Brillo", 0.5, 1.5, 0.05, 1, ""],
          ["SATURACION", "Saturación", 0, 2.5, 0.05, 1, ""],
          ["GANANCIA", "Luz", 0.8, 3.5, 0.05, 1, ""],
          ["GAMMA", "Contraste", 0.6, 2.2, 0.05, 1, ""],
        ], { colores: [["Tinte", "TINTE"], ["Estrellas", "ESTRELLAS"], ["Fugaz", "FUGAZ_COLOR"]] }],
        ["Fondo", [
          ["STAR_DENSITY", "Estrellas", 0, 0.08, 0.005, 100, "%"],
        ]],
        ["Estrellas fugaces", [...FILAS_FUGACES, ["FUGAZ_ANG", "Ángulo", -90, 90, 1, 1, "°"]]],
      ],
      arrancar() { fase = 0; fuga.reiniciar(); cargar(); },
      resize, draw,
      quieto() { fase = 6 * CFG.SPIN * CFG.SENTIDO; draw(6, 0); },
    };
  })();
  // </UNI webb>

  // <UNI bh>
  UNIVERSOS.bh = (() => {
    const DEF = {
      GIRO: 1,                          // velocidad de giro del gas (1 = normal)
      PULSE_EVERY: 10,                  // cada cuántos segundos se encoge y hace el destello (0 = sin pulsos)
      SHRINK: 0.08,                     // cuánto se encoge antes del destello
      OFFSET_X: 0,                      // desplaza el agujero: -0.25 = izquierda, 0.25 = derecha
      TAM: 1,                           // tamaño del agujero negro
      BRILLO: 1,                        // brillo general
      C_ROJO: "#f24e14",                // color del gas más frío
      C_NARANJA: "#ff7c22",             // color del gas medio
      C_AMBAR: "#ffac4e",               // color del gas caliente
      C_NUCLEO: "#ffdea8",              // color de lo más brillante
      C_ESTRELLAS: "#dce4ff",           // color de las estrellas
    };
    const CFG = JSON.parse(JSON.stringify(DEF));
    const COM = {"GIRO": "velocidad de giro del gas (1 = normal)", "PULSE_EVERY": "cada cuántos segundos se encoge y hace el destello (0 = sin pulsos)", "SHRINK": "cuánto se encoge antes del destello", "OFFSET_X": "desplaza el agujero: -0.25 = izquierda, 0.25 = derecha", "TAM": "tamaño del agujero negro", "BRILLO": "brillo general", "C_ROJO": "color del gas más frío", "C_NARANJA": "color del gas medio", "C_AMBAR": "color del gas caliente", "C_NUCLEO": "color de lo más brillante", "C_ESTRELLAS": "color de las estrellas"};

    // ---------- CONSTANTES (de black_hole.py) ----------
    const R0 = 0.11, TILT = 17 * Math.PI / 180, INC = 0.12;
    const R_IN = 1.55 * R0, R_OUT = 5.4 * R0, FLASH = 7.800222;
    const POOLS = ["1il!;:", "rtfjcvxz=+", "aeoun0{}[]<>", "08B$#&%Q"];
    const STATIC_T = 9.5;             // frame fijo si el usuario pide menos movimiento
    const DEEP = 0, RED = 1, ORANGE = 2, AMBER = 3, HOT = 4, STAR = 5, DUST = 6;
    const COS_T = Math.cos(TILT), SIN_T = Math.sin(TILT);
    let TAG, rnd, hsh, wAcc = 0, limpiar = true;

    function recolor() {
      const rojo = hex(CFG.C_ROJO);
      TAG = [[rojo[0] * 0.785, rojo[1] * 0.49, rojo[2] * 0.6], rojo, hex(CFG.C_NARANJA), hex(CFG.C_AMBAR), hex(CFG.C_NUCLEO), hex(CFG.C_ESTRELLAS), [130, 72, 48]];
    }
    recolor();

    // ---------- matemática ----------
    const spin = t => {
      const s = Math.max(t - FLASH, 0);
      return 0.060222 * t + 0.28 * (s - 0.8 * (1 - Math.exp(-s / 0.8)));
    };
    const ripple = (a, b, t) =>
      Math.sin(a + 0.900222 * Math.sin(b + 1.3 * t)) * 0.5 +
      Math.sin(2.3 * a - b + 0.7 * t) * 0.3 +
      Math.sin(4.1 * a + 1.7 * b - 1.1 * t) * 0.2;

    const PULSES = [[1.8, 0.0, 0.95], [2.4, 2.1, 0.8], [3.2, 4.2, 0.65]];
    let gPhase = 0, gLr = 0, gPulse = 0;           // salidas extra de gas()

    // anillos finos de gas en órbitas circulares; los internos giran más rápido
    function gas(phi, rho, t, w) {
      rho = Math.max(rho, 1e-6);
      const phase = phi - Math.pow(rho / R_IN, -1.5) * w;
      const lr = Math.log(rho / R0);
      const a = 46 * lr + 0.9 * Math.sin(phase + 3 * lr);
      let streak = 0.55 + 0.3 * Math.sin(a) + 0.15 * Math.sin(2.3 * a + 2 * phase)
        + 0.12 * Math.sin(3 * phase - 7 * lr + 0.3 * t);
      if (gPulse > 0) {                 // cometas de luz que viajan por las órbitas
        let pulses = 0;
        for (const [ringR, start, speed] of PULSES) {
          const d = mod(phi - start - speed * t + Math.PI, TAU) - Math.PI;
          const comet = d > 0 ? Math.exp(-((d / 0.18) ** 2)) : Math.exp(d / 0.9);
          pulses += comet * Math.exp(-(((lr - Math.log(ringR)) / 0.07) ** 2));
        }
        streak += 0.9 * gPulse * pulses;
      }
      gPhase = phase; gLr = lr;
      return streak;
    }

    // la cara trasera del disco, doblada sobre la sombra
    function lensedHalo(r, ang, t, w) {
      const top = 0.5 - 0.5 * Math.sin(ang - TILT);
      const side = Math.abs(Math.cos(ang - TILT)) ** 10;
      const o = r - 1.1 * R0;
      const band = Math.exp(-((Math.max(o, 0) / (0.2 * R0 + 0.24 * R0 * top + 0.45 * R0 * side)) ** 2))
        * Math.exp(-((Math.min(o, 0) / (0.2 * R0)) ** 2));
      const rho = (1 - side) * (R_IN + Math.max(r - R0, 0) * 2.6) + side * Math.max(r, R_IN);
      const flow = gas(ang - TILT, rho, t, w);
      return 1.2 * band * flow * (0.5 + 0.8 * top) * (1 - 0.25 * Math.cos(ang - TILT));
    }

    function tangentLetter(dx, dy) {
      const s = mod(Math.atan2(-dy, dx) * 180 / Math.PI, 180);
      if (s < 22.5 || s >= 157.5) return "-";
      if (s < 67.5) return "/";
      if (s < 112.5) return "|";
      return "\\";
    }

    function resize() {
      CW = W < 700 ? 10 : 7; CH = Math.round(CW * 11 / 7);   // celdas más grandes en celular
      gl.width = Math.round(W / 4); gl.height = Math.round(H / 4);
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      cols = Math.ceil(W / CW); rows = Math.ceil(H / CH);
      const R = seeded(7);
      rnd = new Float32Array(cols * rows); hsh = new Uint8Array(cols * rows);
      for (let i = 0; i < rnd.length; i++) { rnd[i] = R(); hsh[i] = (R() * 12) | 0; }
      ctx.font = `${Math.round(CW * 12 / 7)}px Consolas, Menlo, "DejaVu Sans Mono", monospace`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      limpiar = true;
    }

    function draw(t, dt) {
      // el giro se acumula, así cambiar la velocidad no da saltos
      wAcc += (0.060222 + (t > FLASH ? 0.28 * (1 - Math.exp(-(t - FLASH) / 0.8)) : 0)) * dt * CFG.GIRO;
      const trail = !limpiar; limpiar = false;
      const ts = t, open = 1;           // la intro corre una sola vez
      // estela: el frame anterior conserva ~40%; el nuevo se pega con "lighten" (equivale a MAX)
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = trail ? "rgba(0,0,0,0.6)" : "#000";
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighten";

      const PE = CFG.PULSE_EVERY >= 2 ? CFG.PULSE_EVERY : 0, SHRINK = CFG.SHRINK, OFFSET_X = CFG.OFFSET_X, bri = CFG.BRILLO;
      const aspect = W / H;
      const w = wAcc;
      const cam = smooth(smooth((ts - FLASH + 0.3) / 2.6)) * open;
      // pulso periódico: poco antes del destello se encoge un poquito, destella y vuelve a su tamaño
      const u0 = t - FLASH;
      let shrink = 0, extra = 0, since = u0;
      if (PE && u0 > PE - 0.9) {
        const q = u0 % PE, n = Math.floor(u0 / PE);
        const pre = smooth((q - (PE - 0.9)) / 0.9);       // se encoge en los 0.9 s previos
        const post = n >= 1 ? 1 - smooth(q / 1.2) : 0;     // y se recupera en 1.2 s
        shrink = Math.max(pre, post);
        since = q;
        if (n >= 1 || q > PE / 2) {
          const sd = q > PE / 2 ? q - PE : q;
          extra = Math.exp(-((sd / 0.22) ** 2));
        }
      }
      const zoom = (1 + 0.28 * cam) * (1 - SHRINK * shrink) * CFG.TAM, inc = INC + 0.09 * cam;
      const flash = Math.max(Math.exp(-(((ts - FLASH) / 0.22) ** 2)), extra);
      const ringK = smooth((ts - 0.3) / 2.2);
      const diskOn = smooth((ts - 5.0) / 2.8) * open;
      const auraK = smooth((ts - 2.2) / 1.8) * (1 - 0.65 * diskOn);
      const span = R0 + diskOn * (R_OUT * 1.1 - R0);
      const diskGate = smooth((ts - 5.0) / 0.8) * (0.55 + 0.45 * smooth((ts - FLASH + 0.3) / 0.4)) * open;
      const haloGate = smooth((ts - 5.0) / 2.2) * open;
      const ringGate = 0.9 + 0.3 * smooth((ts - 5) / 2);
      const front = R0 + since * 0.55;
      const shockFade = since > 0 ? Math.exp(-since / 0.5) * 0.9 : 0;
      gPulse = ts > FLASH ? smooth((ts - FLASH) / 1.0) * open : 0;

      for (let row = 0; row < rows; row++) {
        for (let c = 0; c < cols; c++) {
          const i = row * cols + c;
          const X0 = ((c + 0.5) / cols - 0.5 - OFFSET_X) * aspect + desv;
          const Y0 = (row + 0.5) / rows - 0.5;
          const X = X0 / zoom, Y = (Y0 + 0.02 * cam) / zoom;
          const r = Math.hypot(X, Y), ang = Math.atan2(Y, X);

          // 1. anillo que se dibuja solo
          const around = mod(ang + Math.PI / 2, TAU) / TAU;
          const ring = Math.exp(-(((r - 1.02 * R0) / (0.045 * R0)) ** 2)) * smooth((ringK * 1.08 - around) / 0.08);

          // 2. aura que respira y se funde con los anillos del disco
          const rings = gas(ang - TILT, R_IN + Math.max(r - R0, 0) * 2.6, t, w);
          let puff = 0.5 + 0.5 * ripple(2 * ang, 5 * r - 0.45 * t, 0.35 * t);
          puff = puff * (1 - diskOn) + rings * diskOn;
          const reach = 0.32 * R0 * (0.7 + 0.6 * puff);
          const aura = auraK * Math.exp(-((Math.max(r - R0, 0) / reach) ** 1.6)) * (0.6 + 0.4 * puff);

          // 3. disco inclinado: se rota, se aplasta por INC y se pasa a radio/ángulo
          const u = X * COS_T + Y * SIN_T, v = -X * SIN_T + Y * COS_T;
          const rho = Math.hypot(u, v / inc), phi = Math.atan2(v / inc, u);
          const streak = gas(phi, rho, t, w);
          const phase = gPhase, lr = gLr;
          const edge = smooth((rho - R_IN) / (0.25 * R0)) * smooth((R_OUT - rho) / (2.2 * R0));
          let disk = 1.5 * edge * streak * (R_IN / rho);
          disk *= 1 - 0.25 * u / Math.max(rho, 1e-6);            // Doppler: el lado que se acerca brilla más
          disk *= diskGate * smooth((span - Math.abs(u)) / (0.6 * R0));

          const halo = lensedHalo(r, ang, t, w) * haloGate;
          const shock = ts > FLASH ? Math.exp(-(((r - front) / 0.02) ** 2)) * shockFade : 0;

          // mezcla "screen" en vez de max, para que todo se funda
          let soft = 1 - (1 - clamp(aura * 0.55, 0, 1)) * (1 - clamp(halo, 0, 1)) * (1 - clamp(disk, 0, 1));
          soft = Math.max(soft, disk, halo);
          let heat = Math.max(ring * ringGate, soft, shock) * (1 + 1.4 * flash);

          const inside = r < R0 * 0.97;
          if (inside) heat = v > 0 ? (disk > 0.2 ? disk : 0) : 0;   // la sombra tapa lo de atrás

          let ch = null, tag = DEEP, lum = 0;
          if (heat > 0.07) {
            const level = clamp(Math.floor(heat * 3.6), 0, 3);
            const pool = POOLS[level];
            const k = mod(hsh[i] + Math.floor(phase * 2 + lr * 6), 12) % pool.length;
            ch = pool[k];
            if (ring > aura * 0.8 && ring > disk && ring > halo && ring > 0.25) ch = tangentLetter(-Math.sin(ang), Math.cos(ang));
            tag = heat < 0.1 ? DEEP : heat < 0.2 ? RED : heat < 0.45 ? ORANGE : heat < 0.75 ? AMBER : HOT;
            lum = clamp(0.42 + 0.85 * heat, 0, 1.3) * (0.35 + 0.65 * smooth((heat - 0.07) / 0.15));
          } else if (!inside) {
            const n = rnd[i];
            if (n < 0.0025) {                                        // estrellas
              ch = n < 0.0005 ? "+" : n < 0.0012 ? "*" : ".";
              tag = STAR; lum = 0.75 + 0.2 * Math.sin(0.8 * t + n * 9000);
            } else if (ts > 4.0) {                                    // polvo en el plano del disco
              const lane = Math.exp(-((((-X * SIN_T + Y * COS_T) - 0.02) / 0.09) ** 2));
              if (n > 1 - 0.035 * lane) {
                ch = n > 1 - 0.01 * lane ? ":" : ",";
                tag = DUST; lum = 0.3 * smooth((ts - 4.0) / 3.0);
              }
            }
          }
          if (ch === null) continue;
          const col = TAG[tag], l = lum * bri;
          ctx.fillStyle = `rgb(${Math.min(255, col[0] * l) | 0},${Math.min(255, col[1] * l) | 0},${Math.min(255, col[2] * l) | 0})`;
          ctx.fillText(ch, c * CW + CW / 2, row * CH + CH / 2);
        }
      }
      ctx.globalCompositeOperation = "source-over";

      // glow: copia reducida del canvas; el CSS la desenfoca y la suma encima
      gctx.drawImage(cv, 0, 0, gl.width, gl.height);
    }

    return {
      nombre: "Black hole", archivo: "blackhole.js", fondo: "#000", glow: true,
      DEF, CFG, COM, recolor,
      grupos: [
        ["Agujero negro", [
          ["GIRO", "Giro del gas", 0, 4, 0.05, 1, "×"],
          ["TAM", "Tamaño", 0.5, 1.8, 0.05, 1, ""],
          ["OFFSET_X", "Desplazamiento", -0.4, 0.4, 0.01, 1, ""],
          ["BRILLO", "Brillo", 0.5, 1.6, 0.05, 1, ""],
        ]],
        ["Pulso", [
          ["PULSE_EVERY", "Pulso cada (0 = nunca)", 0, 30, 1, 1, " s"],
          ["SHRINK", "Encogimiento", 0, 0.3, 0.01, 1, ""],
        ]],
        ["Colores", [], { colores: [["Rojo", "C_ROJO"], ["Naranja", "C_NARANJA"], ["Ámbar", "C_AMBAR"], ["Núcleo", "C_NUCLEO"], ["Estrellas", "C_ESTRELLAS"]] }],
      ],
      arrancar() { wAcc = 0; limpiar = true; },
      resize, draw,
      quieto() { wAcc = spin(STATIC_T); limpiar = true; draw(STATIC_T, 0); },
    };
  })();
  // </UNI bh>

  // <PANEL>
  // ---------- PANEL DE CONTROLES ----------
  const panel = document.getElementById("panel"), abrir = document.getElementById("abrir");

  function fila([k, et, mn, mx, st, mul, u]) {
    const d = document.createElement("div"); d.className = "fila";
    d.innerHTML = `<div class="top"><span>${et}</span><b></b></div><input type="range" min="${mn}" max="${mx}" step="${st}" aria-label="${et}">`;
    const inp = d.querySelector("input"), out = d.querySelector("b"), C = U.CFG;
    inp.value = C[k]; out.textContent = redondo(C[k] * mul) + u;
    inp.addEventListener("input", () => { C[k] = +inp.value; out.textContent = redondo(C[k] * mul) + u; });
    return d;
  }

  function construirPanel() {
    const claves = Object.keys(UNIVERSOS);
    panel.innerHTML = `<div class="cab"><span>Controles</span><button id="cerrar" aria-label="Ocultar controles">›</button></div>
      <select id="universo" aria-label="Universo">${claves.map(k => `<option value="${k}">${UNIVERSOS[k].nombre}</option>`).join("")}</select>`;
    const sel = panel.querySelector("#universo");
    sel.value = clave;
    sel.onchange = () => activar(sel.value);

    U.grupos.forEach(([titulo, filas, extra = {}]) => {
      const det = document.createElement("details"); det.open = true;
      det.innerHTML = `<summary>${titulo}</summary>`;
      if (extra.colores) {
        const g = document.createElement("div"); g.className = "sw";
        g.innerHTML = extra.colores.map(([n, k, i]) =>
          `<label>${n}<input type="color" data-k="${k}" data-i="${i === undefined ? "" : i}" value="${i === undefined ? U.CFG[k] : U.CFG[k][i]}"></label>`).join("");
        g.addEventListener("input", e => {
          const { k, i } = e.target.dataset;
          if (i === "") U.CFG[k] = e.target.value; else U.CFG[k][+i] = e.target.value;
          if (U.recolor) U.recolor();
        });
        det.appendChild(g);
      }
      filas.forEach(f => det.appendChild(fila(f)));
      if (extra.sentido) {
        const sg = document.createElement("div"); sg.className = "seg";
        sg.innerHTML = extra.sentido.map(([n, v]) => `<button data-s="${v}">${n}</button>`).join("");
        const marcar = () => sg.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.s === U.CFG.SENTIDO));
        sg.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { U.CFG.SENTIDO = +b.dataset.s; marcar(); } });
        marcar(); det.appendChild(sg);
      }
      panel.appendChild(det);
    });

    const acc = document.createElement("div"); acc.className = "acc";
    acc.innerHTML = `<button id="reiniciar">Reiniciar</button><button id="copiar">Copiar ajustes</button>`;
    panel.appendChild(acc);
    const ex = document.createElement("div");
    ex.innerHTML = `<button class="exp" id="exportar">Exportar script (.js)</button><p class="nota">Descarga el script de este universo con tus valores actuales y las instrucciones de uso adentro.</p>`;
    panel.appendChild(ex);

    panel.querySelector("#cerrar").onclick = () => { panel.classList.add("cerrado"); abrir.hidden = false; };
    panel.querySelector("#reiniciar").onclick = () => {   // solo este universo; los demás conservan sus cambios
      Object.assign(U.CFG, JSON.parse(JSON.stringify(U.DEF)));
      if (U.recolor) U.recolor();
      construirPanel();
    };
    panel.querySelector("#copiar").onclick = e => copiarAjustes(e.currentTarget);
    panel.querySelector("#exportar").onclick = e => exportarScript(e.currentTarget);
  }
  alActivar = construirPanel;

  // texto con los valores actuales, con los mismos nombres que usa el archivo
  function textoAjustes(sangria) {
    const r = v => typeof v === "number" ? Math.round(v * 1000) / 1000 : v;
    return Object.keys(U.CFG).map(k => {
      const base = sangria + k + ": " + JSON.stringify(r(U.CFG[k])) + ",";
      return U.COM[k] ? base.padEnd(sangria.length + 38) + "// " + U.COM[k] : base;
    }).join("\n");
  }

  function copiarAjustes(btn) {
    const txt = textoAjustes("");
    const listo = () => { const o = btn.textContent; btn.textContent = "Copiado"; setTimeout(() => btn.textContent = o, 1300); };
    const respaldo = () => {
      const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); listo(); } catch (_) {} ta.remove();
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(listo, respaldo); else respaldo();
  }

  // ---- exportar: genera un .js de ESTE universo (sin panel) con los valores actuales y lo descarga ----
  function exportarScript(btn) {
    const fuente = document.getElementById("motor").textContent;
    const ajustes = "    // ---- AJUSTES: edita estos valores para cambiar el aspecto ----\n    const CFG = {\n" +
      textoAjustes("      ") + "\n    };\n    const DEF = CFG;\n";

    const escenario = [
      '  const escenario = document.createElement("div");',
      '  escenario.setAttribute("aria-hidden", "true");',
      '  Object.assign(escenario.style, { position: "fixed", top: "0", left: "0", width: "100%", height: "100%", zIndex: "-1", pointerEvents: "none" });',
      '  const nuevoCanvas = () => {',
      '    const c = document.createElement("canvas");',
      '    Object.assign(c.style, { position: "absolute", top: "0", left: "0", width: "100%", height: "100%", display: "block" });',
      '    escenario.appendChild(c); return c;',
      '  };',
      '  const cv = nuevoCanvas(), ctx = cv.getContext("2d");',
      '  const gl = nuevoCanvas(), gctx = gl.getContext("2d");',
      '  Object.assign(gl.style, { filter: "blur(9px)", mixBlendMode: "screen", opacity: ".85" });',
      '  const velo = document.createElement("div");',
      '  Object.assign(velo.style, { position: "absolute", top: "0", left: "0", width: "100%", height: "100%", background: "rgba(0,0,0,.25)" });',
      '  escenario.appendChild(velo);',
      '  document.body.prepend(escenario);',
      '  document.body.style.setProperty("background", "transparent", "important");   // si el <body> tuviera color, taparía la galaxia',
    ].join("\n");
    const stub = '  const panel = { classList: { contains: () => true }, offsetWidth: 0 };   // (en el script exportado no hay panel)';

    let js = fuente
      .replace(/\n  \/\/ <PANEL>[\s\S]*?\/\/ <\/PANEL>\n/, () => "\n" + stub + "\n")
      .replace(/\n  \/\/ <ESCENARIO>[\s\S]*?\/\/ <\/ESCENARIO>\n/, () => "\n" + escenario + "\n")
      .replace('const INICIAL = "milky";', () => 'const INICIAL = "' + clave + '";');
    Object.keys(UNIVERSOS).forEach(k => {
      if (k !== clave) js = js.replace(new RegExp("\\n  // <UNI " + k + ">[\\s\\S]*?// </UNI " + k + ">\\n"), () => "\n");
    });
    if (clave === "bh") js = js.replace(/\n  \/\/ <FUGACES>[\s\S]*?\/\/ <\/FUGACES>\n/, () => "\n");
    js = js.replace(/    const DEF = \{[\s\S]*?\n    \};\n    const CFG = JSON\.parse\(JSON\.stringify\(DEF\)\);\n/, () => ajustes);

    const fecha = new Date().toLocaleDateString("es");
    const cabecera = [
      "/* =====================================================================",
      "   " + U.nombre.toUpperCase() + " ASCII  ·  " + U.archivo + "  ·  exportado el " + fecha + " con tus ajustes",
      "",
      "   CÓMO USARLO EN TU HTML",
      "   1. Guarda este archivo junto a tu página, por ejemplo en scripts/" + U.archivo,
      "   2. En tu HTML, justo antes de </body>, agrega esta línea (ajusta la ruta):",
      "",
      '        <script src="scripts/' + U.archivo + '"><\/script>',
      "",
      "   3. Listo. No hace falta crear ningún <canvas>: el script crea el suyo, fijo y a",
      "      pantalla completa, DETRÁS de tu contenido (z-index -1), así tus textos,",
      "      imágenes y menús se ven encima y el fondo no se mueve al hacer scroll.",
      "",
      "   PARA QUE SE VEA Y NADA LO TAPE",
      "   - El script ya deja el <body> sin color de fondo. Pero si un contenedor tuyo",
      "     (header, main, section, div...) tiene background con color sólido, ese",
      "     contenedor tapa el fondo. Quítale el color o usa uno semitransparente,",
      "     por ejemplo: background: rgba(0, 0, 0, 0.4);",
      "   - No pongas dos scripts de universos en la misma página: se pisarían.",
      "   - Si no aparece nada: abre la consola del navegador (F12). Un error 404",
      "     significa que la ruta del <script src> está mal. En GitHub Pages las rutas",
      "     deben ser relativas al repositorio y respetar mayúsculas y minúsculas.",
      "",
      "   PARA CAMBIAR EL ASPECTO: edita los valores del bloque CFG de aquí abajo.",
      "   ===================================================================== */",
      "",
    ].join("\n");

    const salida = cabecera + "(function () {\n  function arrancar() {\n" + js.trim() +
      '\n  }\n  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arrancar);\n  else arrancar();\n})();\n';

    const url = URL.createObjectURL(new Blob([salida], { type: "text/javascript" }));
    const a = document.createElement("a"); a.href = url; a.download = U.archivo;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    const o = btn.textContent; btn.textContent = "Descargado"; setTimeout(() => btn.textContent = o, 1500);
  }

  abrir.onclick = () => { panel.classList.remove("cerrado"); abrir.hidden = true; };
  if (innerWidth < 700) { panel.classList.add("cerrado"); abrir.hidden = false; }   // en celular empieza oculto
  // </PANEL>

  // ---------- activar un universo y bucle ----------
  function redimensionar() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U.resize();
  }

  const desvObjetivo = () => panel.classList.contains("cerrado") ? 0 : (panel.offsetWidth / 2) / H;

  function activar(k) {
    clave = k; U = UNIVERSOS[k]; t = 0;          // la animación del universo empieza de cero; sus ajustes se conservan
    document.documentElement.style.background = U.fondo;
    gl.style.display = velo.style.display = U.glow ? "block" : "none";
    ctx.globalCompositeOperation = "source-over";
    U.arrancar();
    redimensionar();
    alActivar();
    if (still.matches) { desv = desvObjetivo(); U.quieto(); }
  }

  addEventListener("resize", () => { redimensionar(); if (still.matches) { desv = desvObjetivo(); U.quieto(); } });

  let last = 0;
  function loop(ms) {
    requestAnimationFrame(loop);
    if (still.matches || ms - last < 1000 / FPS) return;
    const dt = last ? Math.min((ms - last) / 1000, 0.1) : 0;   // si la pestaña estuvo oculta no se saltea la intro
    last = ms; t += dt;
    desv += (desvObjetivo() - desv) * 0.15;                    // se desliza suave al abrir o cerrar el panel
    U.draw(t, dt);
  }

  activar(INICIAL);
  requestAnimationFrame(loop);
})();
</script>
